<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contatto - Antonio Alain Elietto</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: url('sfondo.jpg') no-repeat center center fixed;
        background-size: cover;
        margin: 0;
        padding: 0;
        text-align: center;
    }
   .card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    max-width: 420px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

    .foto-profilo {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid white;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        margin-bottom: 20px;
    }
    h1 {
        margin-bottom: 5px;
        font-size: 26px;
    }
    h2 {
        margin-top: 0;
        font-size: 18px;
        color: white;
    }
    .info {
        margin: 20px 0;
        font-size: 16px;
        line-height: 1.6;
    }
    .btn {
        display: inline-block;
        padding: 15px 25px;
        background: #007aff;
        color: white;
        border-radius: 10px;
        text-decoration: none;
        font-size: 18px;
        margin-top: 20px;
    }
</style>
</head>
<body>

<div class="card">
    <img src="foto.jpg" class="foto-profilo" alt="Foto profilo">
    <h1>Antonio Alain Elietto</h1>
    <h2>Consulente vendite - Sky</h2>

    <div class="info">
        📞 3465789609<br>
        📧 antonio.elietto.manpower@skytv.it
    </div>

    <a class="btn" href="contatto.vcf">
        Salva Contatto
    </a>
</div>

</body>
</html>
